<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product list with cart</title>

  <link rel="stylesheet" href="style.css">
</head>
<body class="flex width margin">
  <main class="flex">
    <h1 class="width">Desserts</h1>

    <div class="card width">

      <div class="items">

        <div class="item">

          <div class="bimage"></div>

          <div class="cartItem height3">

            <div class="notAdded flex">
              <img src="assets/images/icon-add-to-cart.svg" alt="not found" class="cartImage">
              
              <span class="rose900 weight600">Add to Cart</span>
            </div>

            <div class="added flex">
              <div class="addedimg flex">
                <svg xmlns="http://www.w3.org/2000/svg" width="10" height="2" fill="none" viewBox="0 0 10 2">
                  <path fill="#fff" d="M0 .375h10v1.25H0V.375Z"/>
                </svg>
              </div>
              <span class="font">1</span>
              <div class="addedimg flex">
                <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" fill="none" viewBox="0 0 10 10">
                  <path fill="#fff" d="M10 4.375H5.625V0h-1.25v4.375H0v1.25h4.375V10h1.25V5.625H10v-1.25Z"/>
                </svg>
              </div>
            </div>

          </div>

          <p class="p1 rose400 weight600"></p>

          <p class="p2 rose900 weight600"></p>

          <p class="p3 red weight600"></p>
          
        </div>

      </div>

      <div class="cart">

        <p class="heading red weight700 margin">Your Cart <span>(0)</span></p>

        <img src="assets/images/illustration-empty-cart.svg" alt="not found" class="image">

        <p class="end rose400 weight700">Your added items will appear here</p>

        <div class="orderItems width">

          <div class="orderItem width">
            <p class="orderName rose900 weight600"></p>

            <span class="orderAmount red weight600"></span>
            <span class="orderRate rose400"></span>
            <span class="orderTotal weight600"></span>

            <div class="addedimg2 flex">
              <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" fill="none" viewBox="0 0 10 10" class="svg">
                <path class="path" fill="#CAAFA7" d="M8.375 9.375 5 6 1.625 9.375l-1-1L4 5 .625 1.625l1-1L5 4 8.375.625l1 1L6 5l3.375 3.375-1 1Z"/>
              </svg>
            </div>

            <hr class="hr">

          </div>

        </div>

        <div class="finalTotal flex width">
          <span>Order Total</span>
          <span class="finalNumber weight700"></span>
        </div>

        <div class="carbon flex width height3">
          <img src="assets/images/icon-carbon-neutral.svg" alt="not found" class="margin">
          This is a <span class="darken rose900">carbon-neutral</span> delivery
        </div>

        <div class="confirm flex weight600 width height3">
          Confirm order
        </div>

      </div>

    </div>

    <div class="confirmation rose900">
      <img src="assets/images/icon-order-confirmed.svg" alt="not found ">

      <h1>
        <span class="line">Order</span>
        <span class="line">Confirmed</span>
      </h1>

      <p class="text rose400">We hope you enjoyed your food !</p>

      <div class="cartDisplay">

        <div class="itemsDisplay width">
          <div class="itemDisplay width">
            <div class="left"></div>
            <div class="middle rose400 weight600">
              <p></p>
              <span class="markup red"></span>
              <span></span>
            </div>
            <div class="right flex rose900 weight600"><p></p></div>
            <hr class="hrDisplay width margin">
          </div>
        </div>

        <div class="totalDisplay flex width height3">
          <span>Order Total</span>
          <span class="finalDisplay weight600 rose900"></span>
        </div>

      </div>

      <div class="startNew weight600 flex width height3">
        Start New Order
      </div>

    </div>

  </main>

<script src="code.js"></script>
</body>
</html>
