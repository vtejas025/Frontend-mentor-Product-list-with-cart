<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product list with cart</title>

  <link rel="stylesheet" href="style.css">
</head>
<body class="flex">

  <main>
    <div class="card">

      <h1>
        Desserts
      </h1>

      <div class="items">

        <div class="item">

          <img alt="" class="bgImage"/>

          <div class="option">

            <div class="notAdded flex">
              <img src="assets/images/icon-add-to-cart.svg" alt="">

              <span>Add to Cart</span>
            </div>

            <div class="added flex">

              <div class="circle minus flex">
                <svg xmlns="http://www.w3.org/2000/svg" width="10" height="2" fill="none" viewBox="0 0 10 2"><path fill="#fff" d="M0 .375h10v1.25H0V.375Z"/></svg>
              </div>

              <span class="count">1</span>

              <div class="circle plus flex">
                <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" fill="none" viewBox="0 0 10 10"><path fill="#fff" d="M10 4.375H5.625V0h-1.25v4.375H0v1.25h4.375V10h1.25V5.625H10v-1.25Z"/></svg>
              </div>

            </div>

          </div>

          <p class="category"></p>

          <p class="name"></p>

          <p class="price"></p>

        </div>
        
      </div>

      <div class="cart">

        <p class="para">Your Cart (<span class="totalItems">0</span>)</p>

        <div class="empty flex">

          <img src="assets/images/illustration-empty-cart.svg" alt="empty cart">
        
          <span class="cartText">
            Your added items will appear here
          </span>

        </div>

        <div class="order">

          <div class="cartItems">

            <div class="cartItem">

              <p class="orderName"></p>

              <span class="orderNumber"></span>

              <span class="orderRate margin"></span>

              <span class="orderAmount margin"></span>

              <div class="close flex">
                <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" fill="none" viewBox="0 0 10 10"><path fill="#CAAFA7" d="M8.375 9.375 5 6 1.625 9.375l-1-1L4 5 .625 1.625l1-1L5 4 8.375.625l1 1L6 5l3.375 3.375-1 1Z"/></svg>
              </div>

              <hr>

            </div>

          </div>

          <div class="orderTotal flex">

            <span>
              Order Total
            </span>

            <span class="totalAmount">

            </span>

          </div>

          <div class="message flex">

            <img src="assets/images/icon-carbon-neutral.svg" alt="">

            <p>
              This is a 
              <span class="carbon">carbon-neutral</span>
              delivery
            </p>

          </div>

          <button class="flex" id="confirm">
            Confirm order
          </button>
        
        </div>

      </div>

    </div>  

    <div class="overlay">

    </div>

    <div class="confirmation flex">

      <div class="wrapper">
          
        <img src="assets/images/icon-order-confirmed.svg" alt="">

        <h1>
          Order Confirmed
        </h1>

        <p>
          We hope you enjoy your food!
        </p>

        <div class="finalOrder">

          <div class="orderItems">

            <div class="orderItem flex">

              <div class="orderItemImage"></div>

              <div class="orderItemDetails">

                <p class="orderName"></p>

                <span class="orderNumber"></span>

                <span class="orderRate margin"></span>

              </div>

              <span class="orderAmount flex"></span>

            </div>

          </div>

          <div class="orderTotal flex">

            <span>
              Order Total
            </span>

            <span class="totalAmount">

            </span>

          </div>

        </div>
      
        <button id="newOrder">Start new Order</button>

      </div>

    </div>

  </main>

<script src="code.js"></script>
</body>
</html>
